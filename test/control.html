<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag Dial with Full CSS</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/Draggable.min.js"></script>

    <style>
        :root {
            --font-h1-size: clamp(2rem, 6vw, 3.5rem);
            --font-h2-size: clamp(1.75rem, 4vw, 2.5rem);
            --font-h3-size: clamp(1.5rem, 3vw, 1.75rem);
            --font-h4-size: clamp(1.25rem, 2vw, 1.5rem);
            --font-h5-size: clamp(1rem, 1.5vw, 1.25rem);
            --font-h6-size: 20px;
            --font-body-l: 16px;
            --font-body-m: 14px;
            --font-body-s: 12px;
            --font-btn-size: 14px;

            --color-1: #ffde30;
            --color-2: #f78da7;
            --color-3: #cf2e2e;
            --color-4: #8ed1fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tahoma", "Arial", sans-serif;
            /* border: solid 1px red; */

        }
        
        body {
             overflow-x: hidden; /* Ngăn cuộn ngang do ảnh 300vw */
             user-select: none;
        }

        figure img {
            width: 100%;
            height: auto;
            display: block;
        }

        .container {
            width: 100%;
            margin: 0 auto;
            padding-inline: clamp(0.5rem, 8vw, 6%);
            max-width: 1440px;
        }

        .header__nav {
            display: block;
        }

        .menu-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 5%;
            z-index: 10;
        }


        .menu-header nav ul {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-items: center;
            float: right;
            gap: 2rem;
        }

        .menu-header nav ul li {
            list-style: none;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-header nav ul li a {
            text-decoration: none;
            color: var(--color-1);

        }

        .menu-header .menu-btn {
            color: var(--color-1);
            float: right;

            display: none;
        }

        .menu-header .menu-btn i {
            font-size: var(--font-h1-size);
        }

        .mobile-menu {
            position: fixed;
            z-index: 1000;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(90deg, #fdb384, #e9abb0);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }

        .mobile-menu.active {
            transform: translateX(0);
        }

        .header-mobile-menu {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
        }

        .header-mobile-menu i {
            font-size: var(--font-h1-size);
            color: var(--color-1);
        }

        .menu_mobile_nav {
            display: flex;
            padding-top: 2rem;
            justify-content: center;
            text-align: center;
            align-items: center;
            position: relative;

        }

        .menu_mobile_nav ul {
            position: absolute;
            width: 100%;
            list-style: none;
            margin: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            margin-top: 1rem;
        }

        .menu_mobile_nav ul li a {
            font-family: Equip-Bold, Arial, sans-serif;
            text-decoration: none;
            text-transform: uppercase;
            color: white;
            font-weight: 700;
            line-height: 42px;
            font-size: 1.5rem;


        }

        .banana {
            position: absolute;
            top: 70%;
        }

        .home-page {
            overflow: hidden;
        }

        .home_hero_wrapper {
            position: relative;
        }

        .home-hero {
            width: 100vw;
            height: 100vh;
            position: relative;
            /* overflow: hidden; */
        }

        .hero-wrapper {
            position: relative;
            /* width: 100%; */
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: auto auto auto;
            user-select: none;
        }

        .hero-wrapper figure {
            /* grid-column: 1/-1;
        grid-row: 1/-1;
        display: flex; */
            align-items: center;
            position: absolute;
            margin: 0;
            padding: 0;
            justify-self: center;
            align-self: center;
        }

        .backround-sky {
            z-index: 1;
        }

        .backround-mountain {
            z-index: 5;
        }

        .reflections {
            z-index: 4;
        }

      
        .control-daynight { z-index: 2; } 
         
        

        .egg {
            z-index: 3;
        }

        .text-wt,
        .switch,
        .egg-balloon {
            z-index: 6;
        }

        .text-yl {
            z-index: 7;
        }

        .hero-text {
            z-index: 7;
        }

        .raspberry-1,
        .raspberry-2,
        .raspberry-3,
        .tape {
            z-index: 8;
        }

        .hero-wrapper figure.hero-text {
            width: 100%;
            grid-column: 3 / 11;
            grid-row: 1 / 3;
            justify-self: center;
            align-self: center;
        }

        .hero-wrapper figure.backround-sky {
            /* position: fixed; Đã sửa lại từ CSS của bạn */
            inset: 0;
            width: 100%;
            height: 100%;

        }


        .hero-wrapper figure.backround-sky img {
            width: 300vw; 
            height: 100vh;
            object-fit: cover;

        }

        .hero-wrapper figure.egg-balloon {
            grid-column: 1 / 5;
            grid-row: 1 / 4;
            width: 18vw;
            animation: ballonJumps 4s linear infinite forwards;
        }

        .hero-wrapper figure.backround-mountain {
            grid-column: 1 / -1;
            grid-row: 2/4;
            left: 0;
            pointer-events: none;
        }

        .hero-wrapper figure.text-yl,
        .hero-wrapper figure.text-wt {
            grid-column: 4 / 5;
            grid-row: 3 / 5;
            width: 150px;
        }

        .text-yl {
            opacity: 0;
        }

        .text-wt {
            opacity: 1;
        }

        .on .text-yl {
            animation: flicker-on 1.6s ease forwards;
        }

        .on .text-wt {
            opacity: 1;
        }

        .hero-wrapper figure.switch {
            grid-column: 2 / 5;
            grid-row: 4 / 5;
            width: 40px;
        }

        .switch.active {

            transform: scaleY(-1) rotate(21deg);
        }

        .hero-wrapper figure.egg {
            grid-column: 8 / 10;
            grid-row: 3/4;
            pointer-events: none;
            width: 19vw;
            transform: translate(0, -1%);
        }

        
        /* * === ĐÃ SỬA LỖI Ở ĐÂY ===
        */
        .hero-wrapper figure.control-daynight {
            grid-column: 8 / 10;
            grid-row: 3 / 4;
            width: 26vw;
            
         
            /* 2. Tắt animation CSS để GSAP kiểm soát */
            animation: rotate-partial 2.5s linear .25s infinite forwards;
        }

        .control-daynight img {
            width: 100%;
            height: auto;
            cursor: grab; 
        }
        .control-daynight img:active {
            cursor: grabbing;
        }


        .hero-wrapper figure.reflections {
            grid-column: 1 / -1;
            position: absolute;
            top: 103%;
            left: 0;
            width: 100%;
            height: auto;
        }

        .hero-wrapper figure.raspberry-1 {
            top: 107%;
            left: 5%;
            width: 11%;
            animation: rotate-1 5s linear infinite;
        }

        .hero-wrapper figure.raspberry-2 {
            top: 130%;
            left: 13%;
            width: 11%;
            animation: rotate-2 5s linear infinite;
        }

        .hero-wrapper figure.raspberry-3 {
            top: 107%;
            left: 25%;
            width: 11%;
            animation: rotate-3 5s linear infinite;
        }

        .hero-wrapper figure.tape {
            grid-column: 10 / 12;
            grid-row: 3/4;
            top: 90%;
            right: -5%;
            width: 24vw;
        }

        /* (Các style khác của bạn như footer, responsive... 
           vẫn được giữ nguyên ở đây, 
           lược bỏ để câu trả lời ngắn gọn) 
        */
        
        @keyframes ballonJumps {
            0%, 100% { transform: none; }
            25% { transform: translateY(-20px); }
            75% { transform: translateY(20px); }
        }
        @keyframes rotate-1 {
            0%, 50% { transform: rotate(0deg); }
            25% { transform: rotate(-40deg); }
            75% { transform: rotate(40deg); }
        }
        @keyframes rotate-2 {
            0%, 50% { transform: rotate(0deg); }
            25% { transform: rotate(-20deg); }
            75% { transform: rotate(20deg); }
        }
        @keyframes rotate-3 {
            0%, 50% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }
        @keyframes rotate-partial {
            0% { transform: rotate(0deg); }
            5% { transform: rotate(5deg); }
            10% { transform: rotate(-0deg); }
            15% { transform: rotate(-5deg); }
            20% { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes flicker-on {
            0% { opacity: 1; }
            20% { opacity: 0; }
            40% { opacity: 1; }
            60% { opacity: 0; }
            80%, 100% { opacity: 1; }
        }
        @keyframes flicker-off {
            0% { opacity: 0; }
            20% { opacity: 1; }
            40% { opacity: 0; }
            60% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        
        /* (Media queries của bạn được giữ nguyên) */
        @media (max-width:992px) {
             .hero-wrapper figure.control-daynight {
                grid-column: 7 / 12;
                width: 85%;
            }
        }
         @media (max-width:576px) {
             .hero-wrapper figure.control-daynight {
                width: 120%;
                grid-column: 4/12;
                grid-row: 2/5;
                top: 20%;
                right: -28%;
            }
         }

    </style>
</head>
<body>

    <div class="home-hero">
        <div class="hero-wrapper">
            
            <figure class="backround-sky">
                <img src="sky@2x.jpg" alt="Sky">
            </figure> 
            
            <figure class="backround-mountain">
                 <img src="https://via.placeholder.com/1200x500/8B4513/FFFFFF?text=MOUNTAIN+(Z-5)" alt="Mountain">
            </figure>

            <figure class="egg">
                 <img src="https://via.placeholder.com/200/FFFFE0/000000?text=EGG+(Z-3)" alt="Egg">
            </figure>

            <figure class="egg-balloon">
                 <img src="https://via.placeholder.com/150/FF0000/FFFFFF?text=BALLOON+(Z-6)" alt="Balloon">
            </figure>

            <figure class="control-daynight">
                 <img src="dial.png" alt="Dial">
            </figure>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(Draggable);

            const skyImage = document.querySelector(".backround-sky img");
            const dial = document.querySelector(".control-daynight img");

            // 1. Đặt cảnh ban đầu (mép trái)
            gsap.set(skyImage, { x: 0 });

            // 2. Tạo timeline cho bầu trời
            const skyTl = gsap.timeline({ paused: true });

            // Di chuyển 200vw (Vì ảnh rộng 300vw, viewport rộng 100vw)
            skyTl.to(skyImage, {
                x: "-200vw", 
                ease: "none"
            });

            // 3. Tạo Draggable trên dial
            Draggable.create(dial, {
                type: "rotation", // Xoay tại chỗ
                bounds: { minRotation: 0, maxRotation: 360 }, // Giới hạn 1 vòng
                
                onDrag: function() {
                    let progress = this.rotation / this.maxRotation;
                    skyTl.progress(progress); // Điều khiển timeline bầu trời
                }
            });
        });
    </script>
</body>
</html>
