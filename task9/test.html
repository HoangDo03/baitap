<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Continuous Logo Slider</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flickity/2.2.2/flickity.min.css">
<style>
body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
}
#logo-container {
    opacity: 0;
    transition: opacity 0.5s ease;
}
#logo-container.loaded {
    opacity: 1;
}
.row {
    margin-bottom: 20px;
}
.gallery {
    cursor: default;
    will-change: transform;
}
.gallery-cell {
    width: 120px;
    margin-right: 25px;
}
.gallery-cell img {
    width: 100%;
    display: block;
}
</style>
</head>
<body>

<div id="logo-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flickity/2.2.2/flickity.pkgd.min.js"></script>
<script>
const logoCount = 35;
const rows = 3;
const container = document.getElementById("logo-container");

// Tạo mảng logo
const logos = Array.from({length: logoCount}, (_, i) => `imgs/Logo_cus/${i+1}.png`);

// Tạo HTML cho các row + clone 2 lần
const perRow = Math.ceil(logoCount / rows);
container.innerHTML = Array.from({length: rows}, (_, rowIndex) => {
    const group = logos.slice(rowIndex*perRow, rowIndex*perRow+perRow);
    const cells = [...group, ...group].map(src => `<div class="gallery-cell"><img src="${src}"></div>`).join('');
    return `<div class="row"><div class="gallery gallery-${rowIndex}">${cells}</div></div>`;
}).join('');

// Preload tất cả ảnh
async function preloadImages() {
    const imgs = container.querySelectorAll("img");
    await Promise.all([...imgs].map(img => img.complete ? Promise.resolve() : new Promise(res => { img.onload = img.onerror = res; })));
}

// Khởi tạo Flickity + scroll liên tục
async function startSlider() {
    await preloadImages();
    container.classList.add("loaded");
    await new Promise(requestAnimationFrame); // ensure DOM updated

    const speeds = [1, 1.5, 1]; // px/frame cho mỗi row

    for (let i = 0; i < rows; i++) {
        const selector = `.gallery-${i}`;
        const galleryEl = document.querySelector(selector);
        const flkty = new Flickity(galleryEl, {
            wrapAround: true,
            pageDots: false,
            prevNextButtons: false,
            draggable: false,
            freeScroll: true,
            cellAlign: 'left',
            contain: true
        });

        let paused = false;

        // Hover để pause và bật draggable
        galleryEl.addEventListener('mouseenter', () => {
            paused = true;
            flkty.options.draggable = true;
            flkty.updateDraggable();
            galleryEl.style.cursor = 'grab';
        });
        galleryEl.addEventListener('mouseleave', () => {
            paused = false;
            flkty.options.draggable = false;
            flkty.updateDraggable();
            galleryEl.style.cursor = 'default';
        });

        // Auto-scroll pixel-by-pixel
        (function animate() {
            if (!paused) {
                flkty.x -= speeds[i];
                flkty.positionSlider();
            }
            requestAnimationFrame(animate);
        })();
    }
}

startSlider();
</script>
