<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Tech Orange Tabs</title>
<style>
  body {
    background-color: #111; /* dark tech background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    gap: 20px;
    font-family: sans-serif;
  }

  .tab {
    position: relative;
    width: 100px;
    height: 100px;
    background: #1a1a1a;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ff7a00;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255, 122, 0, 0.3);
    animation: neonPulse 3s infinite ease-in-out, floatTab 4s infinite ease-in-out;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }

  /* Active Tab */
  .tab.active {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff7a00, 0 0 40px #ff9f52;
  }

  /* Border Energy Surge */
  .tab.active::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border: 2px solid #ff7a00;
    border-radius: 14px;
    animation: borderSurge 0.4s forwards;
  }

  /* Shimmer Beam */
  .tab.active::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, rgba(255,122,0,0) 0%, rgba(255,255,200,0.4) 50%, rgba(255,122,0,0) 100%);
    animation: shimmer 0.5s forwards;
  }

  /* Neon Pulse */
  @keyframes neonPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(255,122,0,0.3); }
    50% { box-shadow: 0 0 12px rgba(255,122,0,0.6); }
  }

  /* Floating effect */
  @keyframes floatTab {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  /* Border surge effect */
  @keyframes borderSurge {
    0% { transform: scale(0.9); opacity: 0; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Shimmer beam */
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>

<div class="tab active">Tab 1</div>
<div class="tab">Tab 2</div>
<div class="tab">Tab 3</div>
<div class="tab">Tab 4</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
</script>

</body>
</html>
