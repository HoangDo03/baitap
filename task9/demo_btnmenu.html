<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu Demo</title>
  <style>
    /* Body cơ bản */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Hamburger button */
    .btn_menu_mobile {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 20px;
      height: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 1001; /* nổi trên menu */
      border-radius: 50%;
      padding: 0.5rem;
      border: 4px solid #EF4136;
    }

    .btn_menu_mobile span {
      display: block;
      height: 4px;
      width: 100%;
      background-color: #F15A29;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Khi active: thành X */
    .btn_menu_mobile.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .btn_menu_mobile.active span:nth-child(2) {
      opacity: 0;
    }

    .btn_menu_mobile.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Menu mobile */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 250px;
      height: 100vh;
      background-color: #f2f2f2;
      padding: 50px 20px;
      transition: left 0.3s ease;
      z-index: 1000;
    }

    .mobile-menu.open {
      left: 0;
    }

    /* Menu items */
    .mobile-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .mobile-menu ul li {
      margin-bottom: 20px;
    }

    .mobile-menu ul li a {
      text-decoration: none;
      color: #333;
      font-size: 18px;
      transition: color 0.2s;
    }

    .mobile-menu ul li a:hover {
      color: #007bff;
    }

    /* Overlay mờ phía sau menu */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      z-index: 900;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

  </style>
</head>
<body>

  <!-- Hamburger button -->
  <div class="btn_menu_mobile" id="btnMenu">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <script>
    const btnMenu = document.getElementById('btnMenu');
    const mobileMenu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('overlay');

    btnMenu.addEventListener('click', () => {
      btnMenu.classList.toggle('active');
      mobileMenu.classList.toggle('open');
      overlay.classList.toggle('active');
    });

    // Click overlay để đóng menu
    overlay.addEventListener('click', () => {
      btnMenu.classList.remove('active');
      mobileMenu.classList.remove('open');
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
