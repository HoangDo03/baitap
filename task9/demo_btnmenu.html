<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu Demo</title>
  <style>
  /* TOGGLE BUTTON */
  *{
    border: 1px solid red;
  }
.menu-toggle {
    position: fixed;
    top: 16px;
    right: 16px; /* NÚT BÊN PHẢI */
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #111;
    cursor: pointer;
    z-index: 1001;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-toggle span,
.menu-toggle span::before,
.menu-toggle span::after {
    width: 20px;
    height: 2px;
    background: #fff;
    position: absolute;
    content: '';
}

.menu-toggle span::before { transform: translateY(-6px); }
.menu-toggle span::after  { transform: translateY(6px); }

/* FULLSCREEN MENU */
.fullscreen-menu {
    position: fixed;
    inset: 0;
    background: #111;
    clip-path: circle(0px at calc(100% - 38px) 38px);
    transition: clip-path 0.7s cubic-bezier(.4,0,.2,1);
    z-index: 1000;
}

.fullscreen-menu.active {
    clip-path: circle(150% at calc(100% - 38px) 38px);
}

/* MENU LIST */
.menu-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.menu-list > li {
    margin: 12px 0;     /* CHỈ đặt ở đây */
}

.menu-list > li > a {
    display: block;
    line-height: 1.1;   /* ÉP đều */
    padding: 0;
}


/* MENU ITEM */
.menu-list > li {
    margin: 12px 0;
    text-align: center;
}

.menu-list a {
    color: #fff;
    font-size: 40px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

/* SUBMENU */
.sub-menu {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .45s ease, opacity .3s ease;
}

/* SUBMENU ITEM */
.sub-menu li a {
    font-size: 22px;
    color: #aaa;
    padding: 6px 0;
    display: block;
}

/* ACTIVE */
.menu-item-has-children.open .sub-menu {
    max-height: 300px; /* đủ lớn */
    opacity: 1;
}

/* ARROW */
.arrow {
    font-size: 18px;
    transition: transform .3s ease;
}

.menu-item-has-children.open .arrow {
    transform: rotate(180deg);
}



  </style>
</head>
<body>

  <div class="menu-toggle" id="menuToggle">
    <span></span>
</div>

<nav class="fullscreen-menu" id="menu">
    <ul class="menu-list">
        <li><a href="#">Home</a></li>

        <li class="menu-item-has-children">
            <a href="#" class="submenu-toggle">
                Services
                <span class="arrow">▾</span>
            </a>
            <ul class="sub-menu">
                <li><a href="#">Event Launch</a></li>
                <li><a href="#">Brand Activation</a></li>
                <li><a href="#">Conference</a></li>
            </ul>
        </li>

        <li><a href="#">Projects</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>


<script>
const toggle = document.getElementById('menuToggle');
const menu = document.getElementById('menu');

toggle.addEventListener('click', () => {
    menu.classList.toggle('active');
});

/* SUBMENU */

document.querySelectorAll('.submenu-toggle').forEach(toggle => {
    toggle.addEventListener('click', e => {
        e.preventDefault();

        const parent = toggle.closest('.menu-item-has-children');

        // đóng submenu khác
        document.querySelectorAll('.menu-item-has-children').forEach(item => {
            if (item !== parent) item.classList.remove('open');
        });

        parent.classList.toggle('open');
    });
});


</script>


</body>
</html>
