<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .layer img {
            width: 100%;
        }

        .wrapper {
            width: 100%;
            height: auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: auto;
            position: relative;
            overflow: hidden;
        }

        .sample {
            grid-column: 1/-1;
            grid-row: 1/-1;
        }

        .about_backround_city {
            grid-column: 1/-1;
            align-self: 1/-1;
            z-index: 3;
            position: relative;
            transform: translateY(1%);
        }

        .sunset {
            grid-column: 1/10;
            z-index: 2;
            position: absolute;
            transform: translate(-13%,-10%);
        }

        .flowers-5 {
            grid-column: 1/7;
            position: absolute;
            z-index: 5;
            align-self: end;
            transform: translate(-10%,15%);
        }

        .flowers-6 {
            grid-column: 2/8;
            position: absolute;
            z-index: 5;
            align-self: end;
            transform: translate(1%,6%);
        }

        .paper_circle {
            grid-column: 3/8;
            position: absolute;
            z-index: 4;
            align-self: center;
            transform: translate(-10%,5%);
        }

        .starts_top {
            grid-column: 9/13;
            transform: rotateY(180deg);
            position: absolute;
            z-index: 4;
        }
.starts_mid{
              grid-column: 3/7;
            position: absolute;
            z-index: 3;
            transform: translate(-5%,35%) rotateY(180deg);
}
        .starts_bottom {
            grid-column: 6/10;
            position: absolute;
            z-index: 4;
            align-self: end;
        }

        .human_jump {
            grid-column: 3/8;
            position: absolute;
            z-index: 6;
            align-self: center;
            transform: translate(-13%,5%);
        }

        .pattern {
            grid-column: 3/11;
            position: absolute;
            z-index: 7;
            transform: translate(-6%,22%);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <figure class="layer about_backround_city">
            <img src="imgs/About/18.png" alt="">
        </figure>
        <figure class="layer sunset">
            <img src="imgs/About/13.png" alt="">
        </figure>
        <figure class="layer flowers-5">
            <img src="imgs/About/14.png" alt="">
        </figure>
        <figure class="layer flowers-6">
            <img src="imgs/About/15.png" alt="">
        </figure>
        <figure class="layer paper_circle">
            <img src="imgs/About/17.png" alt="">
        </figure>
        <figure class="layer starts_top">
            <img src="imgs/About/16.png" alt="">
        </figure>
         <figure class="layer starts_mid">
            <img src="imgs/About/16.png" alt="">
        </figure>
        <figure class="layer starts_bottom">
            <img src="imgs/About/16.png" alt="">
        </figure>
        <figure class="layer human_jump">
            <img src="imgs/About/12.png" alt="">
        </figure>
        <figure class="layer pattern">
            <img src="imgs/About/19.png" alt="">
        </figure>

    </div>
</body>

</html>
