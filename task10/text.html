<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero grid stretch theo text</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #7b1b1b;
  color: white;
  font-family: serif;
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ===== GRID CHA: 1 ROW – 3 CỘT ===== */
.hero-container {
  display: grid;
  grid-template-columns: 1fr 6fr 1fr;
  align-items: stretch; /* CHỐT */
  width: 100%;
}

/* ===== TEXT GIỮA (QUYẾT ĐỊNH CHIỀU CAO) ===== */
.hero {
  padding: 4vw 2vw;
  text-align: center;
}

.hero h1 {
  font-size: 3vw;
  margin-bottom: 1rem;
}

.hero p {
  max-width: 800px;
  margin: 0 auto;
  line-height: 1.6;
  font-size: 1.1rem;
}

/* ===== CỘT HÌNH (CAO = TEXT) ===== */
.hero-image-left,
.hero-image-right {
  height: 100%;
  position: relative;
}

/* ===== LEFT: 3 LAYER ===== */
.hero-image-left {
  display: grid;
}

/* tất cả layer nằm chung 1 cell */
.hero-image-left figure {
  grid-row: 1 / -1;
  grid-column: 1 / -1;
  height: 100%;
}

/* layer lệch */
.bg-left-2 {
  transform: translateX(-20%);
}

.bg-left-3 {
  transform: translateY(30%);
  z-index: 2;
}

/* ===== RIGHT ===== */
.hero-image-right figure {
  height: 100%;
}

/* ===== DEMO MÀU (thay bằng ảnh thật) ===== */
.bg-left-1 img {
  background: linear-gradient(180deg, #000, #550000);
}
.bg-left-2 img {
  background: linear-gradient(180deg, #111, #aa0000);
}
.bg-left-3 img {
  background: linear-gradient(180deg, #222, #ff0000);
}
.hero-image-right img {
  background: linear-gradient(180deg, #000, #cc0000);
}
</style>
</head>

<body>

<section class="hero-container">

  <div class="hero-image-left">
    <figure class="bg-left-1">
      <img alt="">
    </figure>
    <figure class="bg-left-2">
      <img alt="">
    </figure>
    <figure class="bg-left-3">
      <img alt="">
    </figure>
  </div>

  <div class="hero">
    <h1>TIMELSS COLLECTIONS</h1>
    <p>
      Trong lần hợp tác cùng nhà thiết kế đồ họa danh tiếng David Carson,
      The Macallan chính thức giới thiệu ngôn ngữ thị giác trong diện mạo mới
      của Timeless Collections.
      <br><br>
      👉 Kéo dài đoạn text này bao nhiêu thì
      <strong>hình 2 bên sẽ dãn cao đúng bấy nhiêu</strong>.
    </p>
  </div>

  <div class="hero-image-right">
    <figure>
      <img alt="">
    </figure>
  </div>

</section>

</body>
</html>
