<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About Us – Pattern Repeat Demo</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Georgia", serif;
        background: #0b1f1b;
    }

    .about {
        min-height: 100vh;
        padding: 80px;

        /* 2 layer: gradient + pattern */
        background-image:
            linear-gradient(
                90deg,
                #0b1f1b 0%,
                rgba(11,31,27,0.95) 55%,
                rgba(11,31,27,0.7) 60%,
                rgba(11,31,27,0.3) 70%,
                rgba(11,31,27,0) 85%
            ),
            url("imgs/bg-decor.png");

        background-repeat:
            no-repeat,
            repeat;

        background-size:
            cover,
            280px 220px; /* size tile */

        background-position:
            left center,
            top left;

        display: flex;
        align-items: center;
    }

    .about__content {
        max-width: 520px;
        color: #fff;
        background-color: #0b1f1b;
    }

    .about__content h2 {
        font-size: 48px;
        margin-bottom: 24px;
        font-weight: 500;
    }

    .about__content p {
        font-size: 18px;
        line-height: 1.7;
        color: rgba(255,255,255,0.9);
    }
</style>
</head>
<body>

<section class="about">
    <div class="about__content">
        <h2>About Us</h2>
        <p>
            Since our founding in 1919, a constant thread has woven Bona’s foundation.
            Our values—passion, performance, and pioneering—shape everything we do,
            from our products to our company culture to our responsible business practices.
            It’s how we operate our business and engage with the world.
        </p>
    </div>
</section>

</body>
</html>
